spring:
  application:
    name: running-olle
  profiles:
    include: secret
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    show-sql: true

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

tourism:
  sync:
    area-code: "39"
    content-type-ids: [ "12", "14", "28" ]
    page-size: 100
    scheduler-enabled: false
    cron: "0 0 4 * * *"
    zone: Asia/Seoul

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: info
